<!-- Sidebar backdrop for mobile -->
@if (isOpen()) {
<div class="fixed inset-0 z-30 bg-black/40 lg:hidden" (click)="close.emit()" aria-hidden="true"></div>
}

<!-- Sidebar -->
<aside class="fixed z-40 top-20 bottom-0 left-0 w-72 lg:w-72 transform transition-transform duration-200 bg-white dark:bg-black border-r border-neutral-200 dark:border-neutral-800 overflow-y-auto lg:translate-x-0"
       [class.-translate-x-full]="!isOpen()" role="navigation" aria-label="Navigation latérale">
  <app-sidebar-header (close)="close.emit()" />
  <app-sidebar-nav [items]="navItems()" />
</aside>
