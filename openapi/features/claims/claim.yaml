openapi: 3.0.3
info:
  title: Claim API
  description: API for managing claims and their lines
  version: 1.0.0
servers:
  - url: /api/v1/optifact
    description: Default server
tags:
  - name: Claim
    description: Operations related to claims
paths:
  /claims:
    get:
      tags:
        - Claim
      summary: Search claims
      description: Searches for claims based on the provided criteria
      operationId: searchClaims
      parameters:
        - $ref: '../../parameters/common.yaml#/accept-language'
        - $ref: '../../parameters/common.yaml#/pageParam'
        - $ref: '../../parameters/common.yaml#/sizeParam'
        - $ref: '../../parameters/common.yaml#/sortFieldParam'
        - $ref: '../../parameters/common.yaml#/sortDirectionParam'
        - name: referenceFilter
          in: query
          description: Optional claim reference filter (case-insensitive, partial match)
          required: false
          schema:
            type: string
        - name: actorName
          in: query
          description: Optional actor name filter (case-insensitive, partial match)
          required: false
          schema:
            type: string
        - name: productName
          in: query
          description: Optional product name filter (case-insensitive, partial match)
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Search completed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimPageApiResponseView'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '../../common/schemas.yaml#/ApiErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '../../common/schemas.yaml#/ApiErrorResponse'
    post:
      tags:
        - Claim
      summary: Create a claim
      description: Creates a new claim
      operationId: createClaim
      parameters:
        - $ref: '../../parameters/common.yaml#/accept-language'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClaimApiRequestView'
      responses:
        '201':
          description: Claim created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimApiResponseView'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '../../common/schemas.yaml#/ApiErrorResponse'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '../../common/schemas.yaml#/ApiErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '../../common/schemas.yaml#/ApiErrorResponse'
  /claims/{claimId}:
    get:
      tags:
        - Claim
      summary: Find a claim by ID
      description: Retrieves a claim by its unique identifier
      operationId: findClaimById
      parameters:
        - $ref: '../../parameters/common.yaml#/accept-language'
        - name: claimId
          in: path
          description: ID of the claim to retrieve
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Claim found successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimApiResponseView'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '../../common/schemas.yaml#/ApiErrorResponse'
        '404':
          description: Claim not found
          content:
            application/json:
              schema:
                $ref: '../../common/schemas.yaml#/ApiErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '../../common/schemas.yaml#/ApiErrorResponse'
    delete:
      tags:
        - Claim
      summary: Delete a claim
      description: Removes a claim (and cascades to its lines)
      operationId: deleteClaim
      parameters:
        - $ref: '../../parameters/common.yaml#/accept-language'
        - name: claimId
          in: path
          description: ID of the claim to delete
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Claim deleted successfully
          content:
            application/json:
              schema:
                $ref: '../../common/schemas.yaml#/ApiSuccessResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '../../common/schemas.yaml#/ApiErrorResponse'
        '404':
          description: Claim not found
          content:
            application/json:
              schema:
                $ref: '../../common/schemas.yaml#/ApiErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '../../common/schemas.yaml#/ApiErrorResponse'
components:
  schemas:
    ClaimStateView:
      type: string
      enum: [DRAFT, SUBMITTED, IN_INSTRUCTION, VALIDATED, REJECTED, DONE, CANCELLED]
    ClaimLineStatusView:
      type: string
      enum: [DRAFT, UPLOADED, VALIDATED, REJECTED, CANCELLED]
    ClaimApiRequestView:
      type: object
      required:
        - actorId
        - productId
      properties:
        actorId:
          type: string
          format: uuid
          description: Identifier of the actor who submitted the claim
        productId:
          type: string
          format: uuid
          description: Identifier of the product the claim relates to
        reference:
          type: string
          description: Optional claim reference (unique); can be generated server-side
    ClaimLineResponseView:
      type: object
      required:
        - id
        - status
      properties:
        id:
          type: string
          format: uuid
        createdAt:
          type: string
          description: Creation timestamp (ISO8601)
        updatedAt:
          type: string
          description: Update timestamp (ISO8601)
        attachmentId:
          type: string
          format: uuid
        validateAt:
          type: string
        validateById:
          type: string
          format: uuid
        rejectedAt:
          type: string
        rejectedById:
          type: string
          format: uuid
        cancelledAt:
          type: string
        cancelledById:
          type: string
          format: uuid
        attachmentTypeName:
          type: string
        status:
          $ref: '#/components/schemas/ClaimLineStatusView'
        reason:
          type: string
    ClaimResponseView:
      type: object
      required:
        - id
        - actorId
        - productId
        - state
        - reference
      properties:
        id:
          type: string
          format: uuid
        createdAt:
          type: string
          description: Creation timestamp (ISO8601)
        updatedAt:
          type: string
          description: Update timestamp (ISO8601)
        actorId:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
        submitAt:
          type: string
        managerId:
          type: string
          format: uuid
        inInstructionAt:
          type: string
        instructorId:
          type: string
          format: uuid
        validateAt:
          type: string
        rejectAt:
          type: string
        doneById:
          type: string
          format: uuid
        doneAt:
          type: string
        cancelById:
          type: string
          format: uuid
        cancelAt:
          type: string
        state:
          $ref: '#/components/schemas/ClaimStateView'
        reference:
          type: string
        lines:
          type: array
          items:
            $ref: '#/components/schemas/ClaimLineResponseView'
    ClaimApiResponseView:
      allOf:
        - $ref: '../../common/schemas.yaml#/ApiSuccessResponse'
        - type: object
          properties:
            data:
              type: object
              additionalProperties:
                $ref: '#/components/schemas/ClaimResponseView'
    ClaimPageResponseView:
      allOf:
        - $ref: '../../common/schemas.yaml#/PaginationResponseView'
        - type: object
          required:
            - elements
          properties:
            elements:
              type: array
              description: The list of claims
              items:
                $ref: '#/components/schemas/ClaimResponseView'
    ClaimPageApiResponseView:
      allOf:
        - $ref: '../../common/schemas.yaml#/ApiSuccessResponse'
        - type: object
          properties:
            data:
              type: object
              additionalProperties:
                $ref: '#/components/schemas/ClaimPageResponseView'