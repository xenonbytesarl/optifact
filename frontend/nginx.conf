# Nginx configuration for the Angular frontend (SPA)
# - Serves static files built into /usr/share/nginx/html
# - Proxies API calls to the backend Spring Boot service
# - Handles SPA routing by falling back to index.html

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
  worker_connections  1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

  access_log  /var/log/nginx/access.log  main;

  sendfile        on;
  keepalive_timeout  65;
  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

  server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Cache static assets aggressively (they are hashed in production builds)
    location ~* \.(?:css|js|woff2?|ttf|eot|otf|svg|png|jpe?g|gif|ico)$ {
      try_files $uri =404;
      access_log off;
      expires 1y;
      add_header Cache-Control "public, immutable";
    }

    # Proxy API calls to the backend service (docker-compose service name: backend)
    location /api/ {
      proxy_pass http://backend:8080/api/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Fallback to index.html for client-side routing
    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
