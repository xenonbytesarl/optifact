openapi: 3.0.3
info:
  title: Claim API
  description: API for managing claims and their lines
  version: 1.0.0
servers:
  - url: /api/v1/optifact
    description: Default server
tags:
  - name: Claim
    description: Operations related to claims
paths:
  /claims:
    get:
      tags:
        - Claim
      summary: Search claims
      description: Searches for claims based on the provided criteria
      operationId: searchClaims
      parameters:
        - $ref: '../../parameters/common.yaml#/accept-language'
        - $ref: '../../parameters/common.yaml#/pageParam'
        - $ref: '../../parameters/common.yaml#/sizeParam'
        - $ref: '../../parameters/common.yaml#/sortFieldParam'
        - $ref: '../../parameters/common.yaml#/sortDirectionParam'
        - name: referenceFilter
          in: query
          description: Optional claim reference filter (case-insensitive, partial match)
          required: false
          schema:
            type: string
        - name: actorName
          in: query
          description: Optional actor name filter (case-insensitive, partial match)
          required: false
          schema:
            type: string
        - name: productName
          in: query
          description: Optional product name filter (case-insensitive, partial match)
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Search completed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimPageApiResponseView'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '../../common/schemas.yaml#/ApiErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '../../common/schemas.yaml#/ApiErrorResponse'
    post:
      tags:
        - Claim
      summary: Create a claim
      description: Creates a new claim
      operationId: createClaim
      parameters:
        - $ref: '../../parameters/common.yaml#/accept-language'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClaimApiRequestView'
      responses:
        '201':
          description: Claim created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimApiResponseView'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '../../common/schemas.yaml#/ApiErrorResponse'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '../../common/schemas.yaml#/ApiErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '../../common/schemas.yaml#/ApiErrorResponse'
  /claims/{claimId}:
    get:
      tags:
        - Claim
      summary: Find a claim by ID
      description: Retrieves a claim by its unique identifier
      operationId: findClaimById
      parameters:
        - $ref: '../../parameters/common.yaml#/accept-language'
        - name: claimId
          in: path
          description: ID of the claim to retrieve
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Claim found successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimApiResponseView'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '../../common/schemas.yaml#/ApiErrorResponse'
        '404':
          description: Claim not found
          content:
            application/json:
              schema:
                $ref: '../../common/schemas.yaml#/ApiErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '../../common/schemas.yaml#/ApiErrorResponse'
    delete:
      tags:
        - Claim
      summary: Delete a claim
      description: Removes a claim (and cascades to its lines)
      operationId: deleteClaim
      parameters:
        - $ref: '../../parameters/common.yaml#/accept-language'
        - name: claimId
          in: path
          description: ID of the claim to delete
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Claim deleted successfully
          content:
            application/json:
              schema:
                $ref: '../../common/schemas.yaml#/ApiSuccessResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '../../common/schemas.yaml#/ApiErrorResponse'
        '404':
          description: Claim not found
          content:
            application/json:
              schema:
                $ref: '../../common/schemas.yaml#/ApiErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '../../common/schemas.yaml#/ApiErrorResponse'
  /claims/{claimId}/claim-lines/{claimLineId}/attachments/{attachmentId}/transfert:
    post:
      tags:
        - Claim
      summary: Transfer an attachment to a claim line
      description: Transfers a new attachment file for the given claim line, replacing the existing attachment reference if present
      operationId: transfertClaimAttachment
      parameters:
        - $ref: '../../parameters/common.yaml#/accept-language'
        - name: claimId
          in: path
          description: ID of the claim
          required: true
          schema:
            type: string
            format: uuid
        - name: claimLineId
          in: path
          description: ID of the claim line
          required: true
          schema:
            type: string
            format: uuid
        - name: attachmentId
          in: path
          description: ID of the attachment to be transferred
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Attachment transferred successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimApiResponseView'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '../../common/schemas.yaml#/ApiErrorResponse'
        '404':
          description: Claim or line or attachment not found
          content:
            application/json:
              schema:
                $ref: '../../common/schemas.yaml#/ApiErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '../../common/schemas.yaml#/ApiErrorResponse'
  /claims/{claimId}/attachments/{attachmentId}/download:
    get:
      tags:
        - Claim
      summary: Download an attachment file
      description: Downloads the binary content of an attachment related to a claim
      operationId: downloadClaimAttachment
      parameters:
        - $ref: '../../parameters/common.yaml#/accept-language'
        - name: claimId
          in: path
          description: ID of the claim
          required: true
          schema:
            type: string
            format: uuid
        - name: attachmentId
          in: path
          description: ID of the attachment to download
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Attachment binary stream
          headers:
            Content-Disposition:
              schema:
                type: string
              description: Suggested filename for download
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          description: Claim or attachment not found
          content:
            application/json:
              schema:
                $ref: '../../common/schemas.yaml#/ApiErrorResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '../../common/schemas.yaml#/ApiErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '../../common/schemas.yaml#/ApiErrorResponse'
  /claims/{claimId}/submit:
    post:
      tags:
        - Claim
      summary: Submit a claim
      description: Submits the claim for processing and moves it from DRAFT to SUBMITTED
      operationId: submitClaim
      parameters:
        - $ref: '../../parameters/common.yaml#/accept-language'
        - name: claimId
          in: path
          required: true
          description: ID of the claim to submit
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Claim submitted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimApiResponseView'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '../../common/schemas.yaml#/ApiErrorResponse'
        '404':
          description: Claim not found
          content:
            application/json:
              schema:
                $ref: '../../common/schemas.yaml#/ApiErrorResponse'
        '409':
          description: Invalid state transition
          content:
            application/json:
              schema:
                $ref: '../../common/schemas.yaml#/ApiErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '../../common/schemas.yaml#/ApiErrorResponse'
  /claims/{claimId}/instruction:
    post:
      tags:
        - Claim
      summary: Move claim to instruction
      description: Moves a submitted claim into instruction state
      operationId: toInstruction
      parameters:
        - $ref: '../../parameters/common.yaml#/accept-language'
        - name: claimId
          in: path
          required: true
          description: ID of the claim
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Claim moved to instruction successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimApiResponseView'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '../../common/schemas.yaml#/ApiErrorResponse'
        '404':
          description: Claim not found
          content:
            application/json:
              schema:
                $ref: '../../common/schemas.yaml#/ApiErrorResponse'
        '409':
          description: Invalid state transition
          content:
            application/json:
              schema:
                $ref: '../../common/schemas.yaml#/ApiErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '../../common/schemas.yaml#/ApiErrorResponse'
  /claims/{claimId}/terminate-instruction:
    post:
      tags:
        - Claim
      summary: Mark instruction rejected or validated
      description: Marks the claim instruction as rejected or validated and moves it to next state
      operationId: terminateInstruction
      parameters:
        - $ref: '../../parameters/common.yaml#/accept-language'
        - name: claimId
          in: path
          required: true
          description: ID of the claim
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Claim instruction done successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimApiResponseView'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '../../common/schemas.yaml#/ApiErrorResponse'
        '404':
          description: Claim not found
          content:
            application/json:
              schema:
                $ref: '../../common/schemas.yaml#/ApiErrorResponse'
        '409':
          description: Invalid state transition
          content:
            application/json:
              schema:
                $ref: '../../common/schemas.yaml#/ApiErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '../../common/schemas.yaml#/ApiErrorResponse'
  /claims/{claimId}/claim-lines/{claimLineId}/validate:
    put:
      tags:
        - Claim
      summary: Validate a claim line
      description: Validates a specific claim line
      operationId: validateClaimLine
      parameters:
        - $ref: '../../parameters/common.yaml#/accept-language'
        - name: claimId
          in: path
          required: true
          description: ID of the claim
          schema:
            type: string
            format: uuid
        - name: claimLineId
          in: path
          required: true
          description: ID of the claim line to validate
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Claim line validated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimApiResponseView'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '../../common/schemas.yaml#/ApiErrorResponse'
        '404':
          description: Claim or claim line not found
          content:
            application/json:
              schema:
                $ref: '../../common/schemas.yaml#/ApiErrorResponse'
        '409':
          description: Invalid state transition
          content:
            application/json:
              schema:
                $ref: '../../common/schemas.yaml#/ApiErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '../../common/schemas.yaml#/ApiErrorResponse'
  /claims/{claimId}/claim-lines/{claimLineId}/reject:
    post:
      tags:
        - Claim
      summary: Reject a claim line
      description: Rejects a specific claim line with a reason
      operationId: rejectClaimLine
      parameters:
        - $ref: '../../parameters/common.yaml#/accept-language'
        - name: claimId
          in: path
          required: true
          description: ID of the claim
          schema:
            type: string
            format: uuid
        - name: claimLineId
          in: path
          required: true
          description: ID of the claim line to reject
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - reason
              properties:
                reason:
                  type: string
                  minLength: 1
      responses:
        '200':
          description: Claim line rejected successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimApiResponseView'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '../../common/schemas.yaml#/ApiErrorResponse'
        '404':
          description: Claim or claim line not found
          content:
            application/json:
              schema:
                $ref: '../../common/schemas.yaml#/ApiErrorResponse'
        '409':
          description: Invalid state transition
          content:
            application/json:
              schema:
                $ref: '../../common/schemas.yaml#/ApiErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '../../common/schemas.yaml#/ApiErrorResponse'
components:
  schemas:
    ClaimStateView:
      type: string
      enum: [DRAFT, SUBMITTED, IN_INSTRUCTION, INSTRUCTION_REJECTED, INSTRUCTION_DONE, COMPLETE_COMPLIANT, AGREEMENT_REFUSED, AGREEMENT_GRANTED, AGREEMENT_ADJOURNED, CANCELLED]
    ClaimLineStatusView:
      type: string
      enum: [DRAFT, UPLOADED, VALIDATED, REJECTED, CANCELLED]
    ClaimApiRequestView:
      type: object
      required:
        - actorId
        - productId
      properties:
        actorId:
          type: string
          format: uuid
          description: Identifier of the actor who submitted the claim
        productId:
          type: string
          format: uuid
          description: Identifier of the product the claim relates to
        reference:
          type: string
          description: Optional claim reference (unique); can be generated server-side
    ClaimLineResponseView:
      type: object
      required:
        - id
        - status
      properties:
        id:
          type: string
          format: uuid
        createdAt:
          type: string
          description: Creation timestamp (ISO8601)
        uploadedAt:
          type: string
          description: Creation timestamp (ISO8601)
        attachmentId:
          type: string
          format: uuid
        validateAt:
          type: string
        validateById:
          type: string
          format: uuid
        rejectedAt:
          type: string
        rejectedById:
          type: string
          format: uuid
        cancelledAt:
          type: string
        cancelledById:
          type: string
          format: uuid
        attachmentTypeName:
          type: string
        status:
          $ref: '#/components/schemas/ClaimLineStatusView'
        reason:
          type: string
    ClaimResponseView:
      type: object
      required:
        - id
        - actorId
        - productId
        - state
        - reference
      properties:
        id:
          type: string
          format: uuid
        createdAt:
          type: string
          description: Creation timestamp (ISO8601)
        updatedAt:
          type: string
          description: Update timestamp (ISO8601)
        actorId:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
        submitAt:
          type: string
        managerQuoteId:
          type: string
          format: uuid
        managerCompliantId:
          type: string
          format: uuid
        compliantAt:
          type: string
        inInstructionAt:
          type: string
        instructorId:
          type: string
          format: uuid
        instructionDoneAt:
          type: string
        instructionRejectedAt:
          type: string
        agreementById:
          type: string
          format: uuid
        agreementGrantedAt:
          type: string
        agreementRefusedAt:
          type: string
        agreementAdjournedAt:
          type: string
        cancelById:
          type: string
          format: uuid
        cancelAt:
          type: string
        state:
          $ref: '#/components/schemas/ClaimStateView'
        reference:
          type: string
        uploadStarted:
          type: boolean
        uploadEnded:
          type: boolean
        lines:
          type: array
          items:
            $ref: '#/components/schemas/ClaimLineResponseView'
    ClaimApiResponseView:
      allOf:
        - $ref: '../../common/schemas.yaml#/ApiSuccessResponse'
        - type: object
          properties:
            data:
              type: object
              additionalProperties:
                $ref: '#/components/schemas/ClaimResponseView'
    ClaimPageResponseView:
      allOf:
        - $ref: '../../common/schemas.yaml#/PaginationResponseView'
        - type: object
          required:
            - elements
          properties:
            elements:
              type: array
              description: The list of claims
              items:
                $ref: '#/components/schemas/ClaimResponseView'
    ClaimPageApiResponseView:
      allOf:
        - $ref: '../../common/schemas.yaml#/ApiSuccessResponse'
        - type: object
          properties:
            data:
              type: object
              additionalProperties:
                $ref: '#/components/schemas/ClaimPageResponseView'