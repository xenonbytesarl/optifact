# Nginx configuration for the Angular frontend (SPA, no SSR)
# - Serves static assets from /usr/share/nginx/html
# - Serves index.html for all non-API routes (client-side routing)
# - Proxies API calls to the backend Spring Boot service

# Upstream to the backend service (accessible via Docker network)
upstream backend {
    server optifact-backend:6066;
}

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Cache static assets aggressively (they are hashed in production builds)
  location ~* \.(?:css|js|woff2?|ttf|eot|otf|svg|png|jpe?g|gif|ico)$ {
    try_files $uri =404;
    access_log off;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Proxy API calls to the backend service (docker-compose service name: optifact-backend)
  location /api/ {
    proxy_pass http://backend/api/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # SPA fallback: serve index.html for all other routes
  location / {
    try_files $uri $uri/ /index.html;
  }
}
