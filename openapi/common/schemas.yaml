# Common schemas used across multiple API specifications

MoneyView:
  type: object
  required:
    - amount
    - currency
  properties:
    amount:
      type: string
      format: decimal
      description: The amount
      example: "100.00"
    currency:
      type: string
      description: The currency code
      example: "USD"

BaseApiResponse:
  type: object
  required:
    - timestamp
    - code
    - status
    - success
  properties:
    timestamp:
      type: string
    code:
      type: integer
      format: int32
    status:
      type: string
    success:
      type: boolean

ApiSuccessResponse:
  allOf:
    - $ref: '#/BaseApiResponse'
    - type: object
      properties:
        message:
          type: string

ValidationError:
  type: object
  required:
    - field
    - message
  properties:
    field:
      type: string
    message:
      type: string

ApiErrorResponse:
  allOf:
    - $ref: '#/BaseApiResponse'
    - type: object
      required:
        - reason
        - path
        - trackId
      properties:
        reason:
          type: string
        path:
          type: string
        trackId:
          type: string
          format: uuid
        error:
          type: array
          items:
            $ref: '#/ValidationError'

PaginationResponseView:
  type: object
  required:
    - totalElements
    - totalPages
    - page
    - size
    - first
    - last
  properties:
    totalElements:
      type: integer
      format: int64
      description: The total number of elements
      example: 42
    totalPages:
      type: integer
      format: int64
      description: The total number of pages
      example: 5
    page:
      type: integer
      format: int64
      description: The current page number
      example: 0
    size:
      type: integer
      format: int64
      description: The page size
      example: 10
    first:
      type: boolean
      description: Whether this is the first page
      example: true
    last:
      type: boolean
      description: Whether this is the last page
      example: false
