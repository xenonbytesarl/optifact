openapi: 3.0.3
info:
  title: Sequence API
  description: API for managing sequences (numbering)
  version: 1.0.0
servers:
  - url: /api/v1/optifact
    description: Default server
tags:
  - name: Sequence
    description: Operations related to sequences
paths:
  /sequences:
    get:
      tags:
        - Sequence
      summary: Search sequences
      description: Searches for sequences based on the provided criteria
      operationId: searchSequences
      parameters:
        - $ref: '../../parameters/common.yaml#/accept-language'
        - $ref: '../../parameters/common.yaml#/pageParam'
        - $ref: '../../parameters/common.yaml#/sizeParam'
        - $ref: '../../parameters/common.yaml#/sortFieldParam'
        - $ref: '../../parameters/common.yaml#/sortDirectionParam'
        - name: nameFilter
          in: query
          description: Optional name filter (case-insensitive, partial match)
          required: false
          schema:
            type: string
        - name: codeFilter
          in: query
          description: Optional code filter (case-insensitive, partial match)
          required: false
          schema:
            type: string
        - name: prefixFilter
          in: query
          description: Optional prefix filter (case-insensitive, partial match)
          required: false
          schema:
            type: string
        - name: suffixFilter
          in: query
          description: Optional suffix filter (case-insensitive, partial match)
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Search completed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SequencePageApiResponseView'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '../../common/schemas.yaml#/ApiErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '../../common/schemas.yaml#/ApiErrorResponse'
    post:
      tags:
        - Sequence
      summary: Create a sequence
      description: Creates a new sequence
      operationId: createSequence
      parameters:
        - $ref: '../../parameters/common.yaml#/accept-language'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SequenceApiRequestView'
      responses:
        '201':
          description: Sequence created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SequenceApiResponseView'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '../../common/schemas.yaml#/ApiErrorResponse'
        '409':
          description: Conflict - A sequence with the same name or code already exists
          content:
            application/json:
              schema:
                $ref: '../../common/schemas.yaml#/ApiErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '../../common/schemas.yaml#/ApiErrorResponse'
  /sequences/{sequenceId}:
    get:
      tags:
        - Sequence
      summary: Find a sequence by ID
      description: Retrieves a sequence by its unique identifier
      operationId: findSequenceById
      parameters:
        - $ref: '../../parameters/common.yaml#/accept-language'
        - name: sequenceId
          in: path
          description: ID of the sequence to retrieve
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Sequence found successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SequenceApiResponseView'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '../../common/schemas.yaml#/ApiErrorResponse'
        '404':
          description: Sequence not found
          content:
            application/json:
              schema:
                $ref: '../../common/schemas.yaml#/ApiErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '../../common/schemas.yaml#/ApiErrorResponse'
    put:
      tags:
        - Sequence
      summary: Update a sequence
      description: Updates an existing sequence
      operationId: updateSequence
      parameters:
        - $ref: '../../parameters/common.yaml#/accept-language'
        - name: sequenceId
          in: path
          description: ID of the sequence to update
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SequenceApiRequestView'
      responses:
        '200':
          description: Sequence updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SequenceApiResponseView'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '../../common/schemas.yaml#/ApiErrorResponse'
        '404':
          description: Sequence not found
          content:
            application/json:
              schema:
                $ref: '../../common/schemas.yaml#/ApiErrorResponse'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '../../common/schemas.yaml#/ApiErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '../../common/schemas.yaml#/ApiErrorResponse'
    delete:
      tags:
        - Sequence
      summary: Delete a sequence
      description: Deletes a sequence by id
      operationId: deleteSequence
      parameters:
        - $ref: '../../parameters/common.yaml#/accept-language'
        - name: sequenceId
          in: path
          description: ID of the sequence to delete
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Sequence deleted successfully
          content:
            application/json:
              schema:
                $ref: '../../common/schemas.yaml#/ApiSuccessResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '../../common/schemas.yaml#/ApiErrorResponse'
        '404':
          description: Sequence not found
          content:
            application/json:
              schema:
                $ref: '../../common/schemas.yaml#/ApiErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '../../common/schemas.yaml#/ApiErrorResponse'
  /sequences/code/{code}:
    get:
      tags:
        - Sequence
      summary: Find a sequence by code
      description: Retrieves a sequence by its code
      operationId: findSequenceByCode
      parameters:
        - $ref: '../../parameters/common.yaml#/accept-language'
        - name: code
          in: path
          description: Code of the sequence to retrieve
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Sequence found successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SequenceApiResponseView'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '../../common/schemas.yaml#/ApiErrorResponse'
        '404':
          description: Sequence not found
          content:
            application/json:
              schema:
                $ref: '../../common/schemas.yaml#/ApiErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '../../common/schemas.yaml#/ApiErrorResponse'
components:
  schemas:
    SequenceApiRequestView:
      type: object
      required:
        - code
        - name
        - step
        - size
        - next
        - active
      properties:
        code:
          type: string
          description: Unique code of the sequence
          example: "INV"
        name:
          type: string
          description: Name of the sequence
          example: "Invoice sequence"
        step:
          type: integer
          format: int64
          description: Increment step
          example: 1
        size:
          type: integer
          format: int64
          description: Size of the numeric part
          example: 6
        next:
          type: string
          description: Next number value
          example: "1"
        prefix:
          type: string
          description: Prefix pattern (supports placeholders)
          example: "INV-${yy}-${MM}-"
        suffix:
          type: string
          description: Suffix pattern (supports placeholders)
          example: "-SUF"
        active:
          type: boolean
          description: Whether the sequence is active
    SequenceResponseView:
      type: object
      required:
        - id
        - code
        - name
        - step
        - size
        - next
        - active
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        step:
          type: integer
          format: int64
        size:
          type: integer
          format: int64
        next:
          type: string
        prefix:
          type: string
        suffix:
          type: string
        active:
          type: boolean
    SequenceApiResponseView:
      allOf:
        - $ref: '../../common/schemas.yaml#/ApiSuccessResponse'
        - type: object
          properties:
            data:
              type: object
              additionalProperties:
                $ref: '#/components/schemas/SequenceResponseView'
    SequencePageResponseView:
      allOf:
        - $ref: '../../common/schemas.yaml#/PaginationResponseView'
        - type: object
          required:
            - elements
          properties:
            elements:
              type: array
              description: The list of sequences
              items:
                $ref: '#/components/schemas/SequenceResponseView'
    SequencePageApiResponseView:
      allOf:
        - $ref: '../../common/schemas.yaml#/ApiSuccessResponse'
        - type: object
          properties:
            data:
              type: object
              additionalProperties:
                $ref: '#/components/schemas/SequencePageResponseView'
