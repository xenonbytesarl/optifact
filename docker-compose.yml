version: "3.9"

services:
  optifact-db:
    image: postgres:16-alpine
    container_name: optifact-db
    environment:
      POSTGRES_DB: ${DB_NAME:-optifact}
      POSTGRES_USER: ${DB_USERNAME:-optifact}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-optifact}
      PGPORT: ${DB_PORT:-5466}
    ports:
      - "${DB_PORT:-5432}:${DB_PORT:-5432}"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  optifact-backend:
    image: xenonbytesarl/optifact-backend:latest
    container_name: optifact-backend
    depends_on:
      optifact-db:
        condition: service_healthy
    environment:
      PROFILE: ${PROFILE:-prod}
      BACKEND_PORT: ${BACKEND_PORT:-8080}
      DB_HOST: ${DB_HOST:-optifact-db}
      DB_PORT: ${DB_PORT:-5466}
      DB_NAME: ${DB_NAME:-optifactdb}
      DB_USERNAME: ${DB_USERNAME:-optifact}
      DB_PASSWORD: ${DB_PASSWORD:-optifact}
      FRONTEND_HOST: optifact-frontend
      FRONTEND_PORT: ${FRONTEND_PORT:-6067}
      CLAIM_FILE_ROOT_DIR: ${CLAIM_FILE_ROOT_DIR:-/data/claimFiles}
      SPRING_DATASOURCE_URL: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME:-optifactdb}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-optifact}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-optifact}
      SERVER_PORT: ${BACKEND_PORT:-6066}
    ports:
      - "${BACKEND_PORT:-6066}:${BACKEND_PORT:-6066}"
    volumes:
      - claim_files:${CLAIM_FILE_ROOT_DIR:-/data/claimFiles}

  optifact-frontend:
    image: xenonbytesarl/optifact-frontend:latest
    container_name: optifact-frontend
    depends_on:
      - optifact-backend
    environment:
      FRONTEND_PORT: ${FRONTEND_PORT:-6067}
    ports:
      - "${FRONTEND_PORT:-6067}:80"
    # Nginx serves static assets and handles SPA fallback; API proxied to backend.

volumes:
  db_data:
  claim_files:
