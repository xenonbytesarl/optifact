<!-- App Shell Layout: Topbar + Sidebar + Main Content -->
<div class="app-shell min-h-dvh text-fg bg-gray-50 dark:bg-gray-900">
  <!-- Topbar -->
  <app-topbar
    [isDarkMode]="theme.isDarkMode()"
    (toggleSidebar)="toggleSidebar()"
    (toggleTheme)="theme.toggleTheme()"
  />

  <!-- Layout grid: sidebar + content -->
  <div class="pt-20 flex">
    <app-sidebar [isOpen]="isSidebarOpen()" (close)="closeSidebar()" />

    <!-- Main content -->
    <main class="flex-1 w-full lg:ml-72">
      <div class="px-4 md:px-6 py-6 max-w-7xl mx-auto">
        <div class="mb-4">
          <app-breadcrumbs />
        </div>
        <router-outlet />
      </div>
    </main>
  </div>
</div>

<!-- Styles for active links and utility comments are in app.css -->
