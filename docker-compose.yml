version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: optifact-db
    environment:
      POSTGRES_DB: ${DB_NAME:-optifact}
      POSTGRES_USER: ${DB_USERNAME:-optifact}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-optifact}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: optifact/backend:latest
    container_name: optifact-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      PROFILE: ${PROFILE:-prod}
      BACKEND_PORT: ${BACKEND_PORT:-8080}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-optifact}
      DB_USERNAME: ${DB_USERNAME:-optifact}
      DB_PASSWORD: ${DB_PASSWORD:-optifact}
      FRONTEND_HOST: frontend
      FRONTEND_PORT: 80
      CLAIM_FILE_ROOT_DIR: ${CLAIM_FILE_ROOT_DIR:-/data/claimFiles}
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${DB_NAME:-optifact}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-optifact}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-optifact}
      SERVER_PORT: ${BACKEND_PORT:-8080}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - claim_files:${CLAIM_FILE_ROOT_DIR:-/data/claimFiles}

  frontend-ssr:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: ssr
    image: optifact/frontend-ssr:latest
    container_name: optifact-frontend-ssr
    depends_on:
      - backend
    environment:
      - PORT=4000
    expose:
      - "4000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: web
    image: optifact/frontend:latest
    container_name: optifact-frontend
    depends_on:
      - backend
      - frontend-ssr
    ports:
      - "${FRONTEND_PORT:-80}:80"
    # Nginx serves static assets and proxies HTML to SSR; API proxied to backend.

volumes:
  db_data:
  claim_files:
