openapi: 3.0.3
info:
  title: Product Category API
  description: API for managing product categories
  version: 1.0.0
servers:
  - url: /api/v1/optifact
    description: Default server
tags:
  - name: ProductCategory
    description: Operations related to product categories
paths:
  /product-categories:
    get:
      tags:
        - ProductCategory
      summary: Search product categories
      description: Searches for product category based on the provided criteria
      operationId: searchProductCategories
      parameters:
        - $ref: '../../parameters/common.yaml#/accept-language'
        - $ref: '../../parameters/common.yaml#/pageParam'
        - $ref: '../../parameters/common.yaml#/sizeParam'
        - $ref: '../../parameters/common.yaml#/sortFieldParam'
        - $ref: '../../parameters/common.yaml#/sortDirectionParam'
        - name: nameFilter
          in: query
          description: Optional name filter (case-insensitive, partial match)
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Search completed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductCategoryPageApiResponseView'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '../../common/schemas.yaml#/ApiErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '../../common/schemas.yaml#/ApiErrorResponse'
    post:
      tags:
        - ProductCategory
      summary: Create a product category
      description: Creates a new product category
      operationId: createProductCategory
      parameters:
        - $ref: '../../parameters/common.yaml#/accept-language'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCategoryApiRequestView'
      responses:
        '201':
          description: Product category created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductCategoryApiResponseView'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '../../common/schemas.yaml#/ApiErrorResponse'
        '409':
          description: Conflict - A product category with the same name or code already exists
          content:
            application/json:
              schema:
                $ref: '../../common/schemas.yaml#/ApiErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '../../common/schemas.yaml#/ApiErrorResponse'
  /product-categories/{categoryId}:
    get:
      tags:
        - ProductCategory
      summary: Find a product category by ID
      description: Retrieves a product category by its unique identifier
      operationId: findProductCategoryById
      parameters:
        - $ref: '../../parameters/common.yaml#/accept-language'
        - name: categoryId
          in: path
          description: ID of the product category to retrieve
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Product category found successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductCategoryApiResponseView'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '../../common/schemas.yaml#/ApiErrorResponse'
        '404':
          description: Product category not found
          content:
            application/json:
              schema:
                $ref: '../../common/schemas.yaml#/ApiErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '../../common/schemas.yaml#/ApiErrorResponse'
    put:
      tags:
        - ProductCategory
      summary: Update a product category
      description: Updates an existing product category
      operationId: updateProductCategory
      parameters:
        - $ref: '../../parameters/common.yaml#/accept-language'
        - name: categoryId
          in: path
          description: ID of the product category to update
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCategoryApiRequestView'
      responses:
        '200':
          description: Sequence updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductCategoryApiResponseView'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '../../common/schemas.yaml#/ApiErrorResponse'
        '404':
          description: Product category not found
          content:
            application/json:
              schema:
                $ref: '../../common/schemas.yaml#/ApiErrorResponse'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '../../common/schemas.yaml#/ApiErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '../../common/schemas.yaml#/ApiErrorResponse'
    delete:
      tags:
        - ProductCategory
      summary: Delete a product category
      description: Marks a product category as deleted (soft delete)
      operationId: deleteProductCategory
      parameters:
        - $ref: '../../parameters/common.yaml#/accept-language'
        - name: categoryId
          in: path
          description: ID of the product category to delete
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: ProductCategory deleted successfully
          content:
            application/json:
              schema:
                $ref: '../../common/schemas.yaml#/ApiSuccessResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '../../common/schemas.yaml#/ApiErrorResponse'
        '404':
          description: Product category not found
          content:
            application/json:
              schema:
                $ref: '../../common/schemas.yaml#/ApiErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '../../common/schemas.yaml#/ApiErrorResponse'

components:
  schemas:
    ProductCategoryApiRequestView:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: Name of the product category
          example: "MODIFICATION DES CONDITIONS INITIALES D’AGREMENT"
    ProductCategoryResponseView:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
          format: uuid
          description: The unique identifier
        name:
          type: string
          description: Name of the product category
          example: "MODIFICATION DES CONDITIONS INITIALES D’AGREMENT"
        active:
          type: boolean
          description: Whether the sequence is active

    ProductCategoryApiResponseView:
      allOf:
        - $ref: '../../common/schemas.yaml#/ApiSuccessResponse'
        - type: object
          properties:
            data:
              type: object
              additionalProperties:
                $ref: '#/components/schemas/ProductCategoryResponseView'

    ProductCategoryPageResponseView:
      allOf:
        - $ref: '../../common/schemas.yaml#/PaginationResponseView'
        - type: object
          required:
            - elements
          properties:
            elements:
              type: array
              description: The list of product categories
              items:
                $ref: '#/components/schemas/ProductCategoryResponseView'
    ProductCategoryPageApiResponseView:
      allOf:
        - $ref: '../../common/schemas.yaml#/ApiSuccessResponse'
        - type: object
          properties:
            data:
              type: object
              additionalProperties:
                $ref: '#/components/schemas/ProductCategoryPageResponseView'