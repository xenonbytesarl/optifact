name: CI/CD - Build and Deploy Docker images

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*.*.*' ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Optional custom image tag (defaults to commit SHA)'
        required: false
        default: ''

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ${{ vars.REGISTRY || 'ghcr.io' }}
  IMAGE_NAMESPACE: ${{ vars.IMAGE_NAMESPACE || github.repository_owner }}
  BACKEND_IMAGE_NAME: optifact-backend
  FRONTEND_IMAGE_NAME: optifact-frontend

jobs:
  build-and-push:
    name: Build and push images
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      backend_ref: ${{ steps.meta.outputs.backend_ref }}
      frontend_ref: ${{ steps.meta.outputs.frontend_ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Registry login
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME || github.actor }}
          password: ${{ secrets.REGISTRY_PASSWORD || secrets.GITHUB_TOKEN }}

      - name: Compute tags/refs
        id: meta
        run: |
          TAG="${{ github.sha }}"
          if [ -n "${{ github.event.inputs.image_tag }}" ]; then TAG="${{ github.event.inputs.image_tag }}"; fi
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then TAG="${GITHUB_REF#refs/tags/}"; fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "backend_ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ env.BACKEND_IMAGE_NAME }}:$TAG" >> $GITHUB_OUTPUT
          echo "frontend_ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ env.FRONTEND_IMAGE_NAME }}:$TAG" >> $GITHUB_OUTPUT

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/backend/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.backend_ref }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ env.BACKEND_IMAGE_NAME }}:latest
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ env.BACKEND_IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ env.BACKEND_IMAGE_NAME }}:buildcache,mode=max

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/frontend/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.frontend_ref }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ env.FRONTEND_IMAGE_NAME }}:latest
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ env.FRONTEND_IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ env.FRONTEND_IMAGE_NAME }}:buildcache,mode=max

  deploy:
    name: Deploy to remote server
    needs: build-and-push
    if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.build-and-push.outputs.tag }}
      REGISTRY: ${{ env.REGISTRY }}
      IMAGE_NAMESPACE: ${{ env.IMAGE_NAMESPACE }}
      BACKEND_IMAGE_NAME: ${{ env.BACKEND_IMAGE_NAME }}
      FRONTEND_IMAGE_NAME: ${{ env.FRONTEND_IMAGE_NAME }}
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
      SSH_KEY: ${{ secrets.SSH_KEY }}
      SERVER_APP_DIR: ${{ vars.SERVER_APP_DIR || '/opt/optifact' }}
      ENV_FILE_PATH: ${{ vars.ENV_FILE_PATH || '/opt/optifact/.env' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare artifacts (compose + scripts)
        run: |
          mkdir -p deploy
          cp docker-compose.deploy.yaml deploy/docker-compose.deploy.yaml
          cp -r docker deploy/docker
          cp scripts/deploy/remote-deploy.sh deploy/remote-deploy.sh || true

      - name: Upload artifacts to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.SSH_HOST }}
          username: ${{ env.SSH_USER }}
          port: ${{ env.SSH_PORT }}
          key: ${{ env.SSH_KEY }}
          source: "deploy/*"
          target: "${{ env.SERVER_APP_DIR }}"
          strip_components: 1

      - name: Run remote deployment
        uses: appleboy/ssh-action@v1.2.0
        env:
          TAG: ${{ env.TAG }}
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAMESPACE: ${{ env.IMAGE_NAMESPACE }}
          BACKEND_IMAGE_NAME: ${{ env.BACKEND_IMAGE_NAME }}
          FRONTEND_IMAGE_NAME: ${{ env.FRONTEND_IMAGE_NAME }}
          ENV_FILE_PATH: ${{ env.ENV_FILE_PATH }}
        with:
          host: ${{ env.SSH_HOST }}
          username: ${{ env.SSH_USER }}
          port: ${{ env.SSH_PORT }}
          key: ${{ env.SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            cd "${{ env.SERVER_APP_DIR }}"
            chmod +x remote-deploy.sh || true
            if ! command -v docker >/dev/null 2>&1; then echo 'Docker not installed on server'; exit 1; fi
            if ! command -v docker compose >/dev/null 2>&1; then echo 'Docker Compose V2 not installed on server'; exit 1; fi
            # Login to registry (GHCR supports GITHUB_TOKEN as password but we pass explicit secret)
            echo '${{ secrets.REGISTRY_PASSWORD || secrets.GITHUB_TOKEN }}' | docker login ${{ env.REGISTRY }} -u '${{ secrets.REGISTRY_USERNAME || github.actor }}' --password-stdin
            export IMAGE_TAG="$TAG"
            # Pull images explicitly for faster deploy (compose will also pull if needed)
            docker pull "$REGISTRY/$IMAGE_NAMESPACE/$BACKEND_IMAGE_NAME:$TAG" || true
            docker pull "$REGISTRY/$IMAGE_NAMESPACE/$FRONTEND_IMAGE_NAME:$TAG" || true
            # Create .env if missing
            if [ ! -f "$ENV_FILE_PATH" ]; then
              echo "Creating example env file at $ENV_FILE_PATH";
              mkdir -p "$(dirname "$ENV_FILE_PATH")";
              printf "%s\n" \
                "PROFILE=prod" \
                "BACKEND_PORT=8080" \
                "DB_HOST=db" \
                "DB_PORT=5432" \
                "DB_NAME=optifact_db" \
                "DB_USERNAME=optifact" \
                "DB_PASSWORD=change_me" \
                "CLAIM_FILE_ROOT_DIR=/data/claims" \
                "# docker-compose specific" \
                "IMAGE_TAG=${IMAGE_TAG}" \
                > "$ENV_FILE_PATH"
            fi
            # Export IMAGE_TAG for compose env
            export IMAGE_TAG
            set -x
            docker compose -f docker-compose.deploy.yaml --env-file "$ENV_FILE_PATH" pull || true
            docker compose -f docker-compose.deploy.yaml --env-file "$ENV_FILE_PATH" up -d --remove-orphans
            docker image prune -f || true
